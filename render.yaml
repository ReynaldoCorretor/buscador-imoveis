services:
  - type: web
    name: buscador-imoveis
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Em serviços Docker, o Render injeta a variável PORT automaticamente
    # em tempo de execução — o Dockerfile já lê essa variável no CMD, não
    # precisa configurar nada aqui.
